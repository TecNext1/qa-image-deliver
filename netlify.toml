[build]
  command = "node scripts/write-config.js"
  publish = "site"

[build.environment]
  NODE_VERSION = "20"

# Image links stay on this domain. Netlify fetches the file from jsDelivr.
[[redirects]]
  from = "/*.png"
  to = "https://cdn.jsdelivr.net/gh/TecNext1/qa-image-deliver@main/:splat.png"
  status = 200
  force = true

[[redirects]]
  from = "/*.jpg"
  to = "https://cdn.jsdelivr.net/gh/TecNext1/qa-image-deliver@main/:splat.jpg"
